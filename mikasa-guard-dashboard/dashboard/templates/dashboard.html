<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mikasa Guard — Command Center</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">MG</div>
        <div>
          <div class="brand-title">MIKASA GUARD</div>
          <div class="brand-sub">Dashboard</div>
        </div>
      </div>

      <div class="server-switch" id="serverSwitch">
        <img id="serverIcon" class="server-icon" alt="" />
        <div class="server-meta">
          <div class="server-name" id="serverName">Select server</div>
          <div class="server-action muted">Switch Server ›</div>
        </div>
      </div>
      <div class="server-dropdown hidden" id="serverDropdown"></div>

      <div class="nav-search muted">Search settings, commands</div>

      <nav class="nav">
        <div class="nav-section">Protection &amp; Recovery</div>
        <button class="nav-item active" data-section="overview">Overview</button>
        <button class="nav-item" data-section="raidwatch">Anti-Raid</button>
        <button class="nav-item" data-section="antinuke">Anti-Nuke</button>
        <button class="nav-item" data-section="antialt">Risk Watchlist</button>
        <button class="nav-item" data-section="quarantine">Quarantine</button>
        <button class="nav-item" data-section="verification">Verification</button>
        <button class="nav-item" data-section="antibot">Anti-Bot</button>
        <button class="nav-item" data-section="automod">AutoMod</button>
        <button class="nav-item" data-section="members">Members</button>
        <button class="nav-item" data-section="warnings">Warnings</button>
        <button class="nav-item" data-section="logs">Logs</button>
      </nav>

      <div class="sidebar-foot">
        <div class="user-chip" id="userChip">
          <span id="userName">—</span>
        </div>
        <a class="signout" href="/logout">Sign out</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">// COMMAND CENTER</div>
          <h1 id="pageTitle">Overview</h1>
          <p class="muted" id="pageSubtitle">High-level metrics and recent activity for this community.</p>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="dot"></span>
          <span id="statusText">Loading…</span>
        </div>
      </header>

      <section id="content">
        <div class="loading">Loading dashboard…</div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
